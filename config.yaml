web:
  /dev/stdout
  loglevel: info
  accesslog: -
  
server:
  host: "0.0.0.0"
  port: 5000

# OpenAI Configuration (required for PPT generation)
llm:
  provider: "openai"
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o"

# Image Generation (optional)
image_provider: "pexels"

# Application Settings
app:
  debug: true
  secret_key: "dev-secret-key-change-in-prod"
  max_content_length: 10485760  # 10MB
  allowed_extensions:
    - .pdf
    - .doc
    - .docx
    - .md
    - .txt
